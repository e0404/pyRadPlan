#image: python:3.10-alpine3.19
image: python:3.11.9-slim-bookworm

variables:  # Change pip's cache directory to be inside the project directory since we can only cache local items.
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip/"

stages:
    - build
    - test
    - report
    - package
    - deploy

# before_script:
    # - apk add --no-cache alpine-sdk g++ hdf5-dev llvm14-dev linux-headers
    # - apt-get update

build-matrix:
    stage: build
    parallel:
        matrix:
            - PYTHON_VERSION: ["3.10", "3.12", "3.13", "3.14", "3.11.9"]
    image: python:${PYTHON_VERSION}-slim-bookworm
    variables:
        MATRIX_CACHE_KEY: "venv-${CI_COMMIT_REF_SLUG}-${PYTHON_VERSION}"
    script:
        - python -m pip install --upgrade pip
        - python -m venv .venv
        - . .venv/bin/activate
        # - LLVM_CONFIG=/usr/bin/llvm14-config pip install llvmlite  # Uncomment if needed for numba on specific images
        - pip install --upgrade --upgrade-strategy eager -e ".[gui]"
        # Cached here so tests-matrix does not re-download it every pipeline.
        - pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch unavailable for ${PYTHON_VERSION}"
    cache:
        key: "$MATRIX_CACHE_KEY"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull-push
# TODO: as soon as the COS cache on gitlab works, separate into three jobs running in parallel to the tests
lint:
    stage: test
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    script:
        # - if [ ! -d .venv ]; then python -m venv .venv; fi
        - . .venv/bin/activate
        - pip install ruff==0.15.22
        - return_code=0
        - ruff check --output-format grouped || return_code=$(($return_code + $?))
        - ruff check --exit-zero --output-format grouped --output-file ruff.txt
        - ruff check --exit-zero --output-format gitlab --output-file gl-code-quality-report.json
        - exit $return_code
    artifacts:
        reports:
            codequality: gl-code-quality-report.json
        paths:
            - ruff.txt
        when: always

    allow_failure: true

format:
    stage: test
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    script:
        - . .venv/bin/activate
        - pip install ruff==0.15.22
        - ruff format --check

codespell:
    stage: test
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    script:
        - . .venv/bin/activate
        - pip install codespell
        - return_code=0
        - codespell > codespell.txt || return_code=$?
        - cat codespell.txt
        - python .gitlab/scripts/codespell_to_codequality.py < codespell.txt > gl-codespell-quality.json
        - exit $return_code
    artifacts:
        when: always
        reports:
            codequality: gl-codespell-quality.json
        paths:
            - codespell.txt
            - gl-codespell-quality.json
    allow_failure: true


# Run tests in parallel across multiple Python versions for Merge Requests only
tests-matrix:
    stage: test
    parallel:
        matrix:
            - PYTHON_VERSION: ["3.10", "3.12", "3.13", "3.14", "3.11.9"]
    image: python:${PYTHON_VERSION}-slim-bookworm
    variables:
        MATRIX_CACHE_KEY: "venv-${CI_COMMIT_REF_SLUG}-${PYTHON_VERSION}"
        COVERAGE_FILE: ".coverage.${PYTHON_VERSION}"
        QT_QPA_PLATFORM: "offscreen"
    cache:
        key: "$MATRIX_CACHE_KEY"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull-push
    script:
        - apt-get update && apt-get install -y libgl1 libxkbcommon-x11-0 libegl1 libdbus-1-3 libglib2.0-0 libfontconfig1 libnss3 libasound2 # needed for pyqt tests
        - python -m pip install --upgrade pip
        - python -m venv .venv
        - . .venv/bin/activate
        - pip install --upgrade --upgrade-strategy eager -e ".[gui]"
        # CPU-only torch, so the ai.modelhub loader tests actually run. Tolerated
        # to fail: torch lags new Python releases, and the tests that need it
        # skip themselves when it is absent.
        - pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch unavailable for ${PYTHON_VERSION}, ai.modelhub load tests will skip"
        - pip install coverage pytest pytest-cov
        - mkdir -p .testreports
        - PYVER_SAFE=${PYTHON_VERSION//./}
        - COVER_XML=.testreports/coverage-${PYTHON_VERSION}.xml
        - HTML_DIR=.testreports/html-${PYTHON_VERSION}
        - mkdir -p $HTML_DIR
        - pytest test --junitxml=.testreports/report-${PYTHON_VERSION}.xml --cov=pyRadPlan --cov-report term --cov-report xml:$COVER_XML --cov-report html:$HTML_DIR
    artifacts:
        when: always
        reports:
          junit: .testreports/report-${PYTHON_VERSION}.xml
          coverage_report:
            coverage_format: cobertura
            path: .testreports/coverage-${PYTHON_VERSION}.xml
        paths:
            - .coverage.${PYTHON_VERSION}
            - .testreports/html-${PYTHON_VERSION}
            - .testreports/coverage-${PYTHON_VERSION}.xml
            - .testreports/report-${PYTHON_VERSION}.xml
    coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

# Exercise the optional array-API backends on their CPU builds, once per backend as
# the *default* namespace (PYRADPLAN_XP_*), so engines and tracers run on it too.
# CuPy needs a GPU runner and is therefore not covered here. Marked allow_failure
# while JAX support is still being brought up - remove that once the JAX path is green.
tests-backends:
    stage: test
    image: python:3.11.9-slim-bookworm
    parallel:
        matrix:
            - XP_BACKEND: ["torch", "jax"]
    variables:
        MATRIX_CACHE_KEY: "venv-backends-${CI_COMMIT_REF_SLUG}"
        PYRADPLAN_XP_PREFER_GPU: "false"
        PYRADPLAN_XP_PREFERRED_CPU_ARRAY_BACKEND: "${XP_BACKEND}"
    cache:
        key: "$MATRIX_CACHE_KEY"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull-push
    script:
        - python -m pip install --upgrade pip
        - python -m venv .venv
        - . .venv/bin/activate
        - pip install --upgrade --upgrade-strategy eager -e ".[jax]"
        - pip install torch --index-url https://download.pytorch.org/whl/cpu
        - pip install pytest
        - pytest test/core/xp_utils test/dose test/test_raytracersiddon.py test/stf -q
    allow_failure: true

coverage-aggregate:
    stage: report
    image: python:3.11-slim-bookworm
    needs:
        - job: tests-matrix
          artifacts: true
    script:
        - python -m pip install --upgrade pip
        - pip install coverage
        # Combine only the reference Python (3.11) coverage as canonical; optionally we could merge all.
        - ls -1 .coverage.* || true
        - if [ -f .coverage.3.11.9 ]; then cp .coverage.3.11.9 .coverage; fi
        # If combining all versions is desired later, replace previous line with: coverage combine .coverage.*
        - coverage xml -o .testreports/coverage-aggregated.xml
        - coverage html -d .testreports/html-aggregated
        - coverage report || true
    artifacts:
        when: always
        reports:
          coverage_report:
            coverage_format: cobertura
            path: .testreports/coverage-aggregated.xml
        paths:
            - .testreports/html-aggregated
            - .testreports/coverage-aggregated.xml
    coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

packaging:
    stage: package
    variables:
        TWINE_USERNAME: gitlab-ci-token
        TWINE_PASSWORD: $CI_JOB_TOKEN
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    script:
        #- if [ ! -d .venv ]; then python -m venv .venv; fi
        - . .venv/bin/activate
        - pip install --upgrade build
        - python -m build
    artifacts:
        paths:
            - dist/
        expire_in: 1 week

# Desktop installer (Briefcase, packaging/briefcase) of the GUI. Only the Linux .deb can be
# built here, on the Docker runners: the Windows MSI and the macOS DMG are built by the
# "Desktop installers" GitHub workflow. Briefcase builds a Linux system package under the
# target distribution's own python3, hence the Ubuntu image instead of the python one.
#
# Runs for main, the release candidate branches (rc/*), the devops/* branches for trying out
# changes to the pipeline, and tags. A merge request from rc/X.Y.Z into
# main shows the pipeline of its source branch, so there is deliberately no merge_request_event
# rule: it would add a second, installer-only pipeline that GitLab then reports as the merge
# request's pipeline in place of the one running the tests.
installer-linux:
    stage: package
    image: ubuntu:24.04
    variables:
        DEBIAN_FRONTEND: noninteractive
        PYTHONUTF8: "1"
        QT_QPA_PLATFORM: "offscreen"
    rules:
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^(rc|devops)\//'
        - if: '$CI_COMMIT_TAG'
    script:
        # git: Briefcase fetches its app template with it; gnupg: its package command looks for
        # gpg. The Qt libraries are the system_runtime_requires of the Briefcase project plus
        # those of the smoke test.
        - apt-get update
        - >
            apt-get install -y --no-install-recommends
            ca-certificates git gnupg python3 python3-dev python3-pip python3-venv build-essential dpkg-dev
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1
            libglib2.0-0 libnss3 libasound2t64
        # A venv of /usr/bin/python3 reports the same sys.version, which is what Briefcase
        # checks for the system packaging format.
        - python3 -m venv /opt/briefcase-venv
        - /opt/briefcase-venv/bin/python -m pip install --upgrade pip
        - /opt/briefcase-venv/bin/python -m pip install "briefcase==0.4.5"
        - export PATH=/opt/briefcase-venv/bin:$PATH
        - python packaging/briefcase/scripts/sync_version.py
        - cd packaging/briefcase
        - python scripts/run_briefcase.py create linux system --no-input
        - python scripts/run_briefcase.py build linux system --no-input
        - python scripts/run_briefcase.py run linux system --test --no-input
        # `run --test` copied the test sources into the bundle; refresh the app code
        # (not the requirements) so the installer ships without them.
        - python scripts/run_briefcase.py build linux system --update --no-input
        - python scripts/collect_licenses.py --check
        - python scripts/run_briefcase.py package linux system --no-input
        - ls -l dist
    artifacts:
        when: always
        paths:
            - packaging/briefcase/dist/
            - packaging/briefcase/logs/
        expire_in: 4 weeks

# The pyRadPlan GUI in a web browser (packaging/container, see its README), built with
# Docker-in-Docker like the "Container" GitHub workflow, and tested with the same script.
# For a tag the image is pushed to the container registry of this project as
# pyradplan-web:<version>, and as :latest unless the version is a pre-release. Needs a
# privileged runner for the docker:dind service; without TLS, as the runner need not share
# the certificate volume.
container:
    stage: package
    image: docker:27
    services:
        - docker:27-dind
    variables:
        DOCKER_HOST: tcp://docker:2375
        DOCKER_TLS_CERTDIR: ""
    rules:
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^(rc|devops)\//'
        - if: '$CI_COMMIT_TAG'
    script:
        - >
            docker build -f packaging/container/Dockerfile
            --build-arg VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
            --build-arg REVISION="$CI_COMMIT_SHA" --build-arg SOURCE="$CI_PROJECT_URL"
            -t pyradplan-web .
        - docker run -d --name web -e XPRA_PASSWORD=ci-test pyradplan-web
        - sh packaging/container/smoke_test.sh web
        - |
          if [ -n "$CI_COMMIT_TAG" ]; then
            image="$CI_REGISTRY_IMAGE/pyradplan-web"
            version="${CI_COMMIT_TAG#v}"
            echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
            docker tag pyradplan-web "$image:$version"
            docker push "$image:$version"
            if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              docker tag pyradplan-web "$image:latest"
              docker push "$image:latest"
            fi
          fi
    after_script:
        - docker logs web || true

docs:
    stage: package
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    script:
        #- if [ ! -d .venv ]; then python -m venv .venv; fi
        - . .venv/bin/activate
        - pip install -r docs/requirements.txt
        # Examples are never executed in CI: release commits carry the executed notebooks
        - sphinx-build docs .doc
    artifacts:
        when: always
        paths:
            - .doc

deploy-tag-internal:
    stage: deploy
    variables:
        TWINE_USERNAME: gitlab-ci-token
        TWINE_PASSWORD: $CI_JOB_TOKEN
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+$/'
    script:
        #- if [ ! -d .venv ]; then python -m venv .venv; fi
        - . .venv/bin/activate
        - pip install --upgrade twine
        - python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
    dependencies:
        - packaging

deploy-tag-pypi:
    stage: deploy
    variables:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: $PYPI_TOKEN
    cache:
        key: "venv-${CI_COMMIT_REF_SLUG}-3.11.9"
        paths:
            - .venv/
            - .cache/pip/
        policy: pull
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+$/'
    script:
        #- if [ ! -d .venv ]; then python -m venv .venv; fi
        - . .venv/bin/activate
        - pip install --upgrade twine
        - python -m twine upload dist/*
    dependencies:
        - packaging

pages-internal:
    stage: deploy
    dependencies:
        - coverage-aggregate
        - docs
    script:
        - mv .doc public/

    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
