# GitHub is the primary repository and runs the CI of everything that reaches it, see
# .github/workflows. This pipeline only covers what is left, see workflow:rules below:
#   - internal/* branches, the confidential work that stays on this GitLab: the tests and checks
#   - devops/* branches: all jobs except the deploy stage, for trying out changes to this file
#   - main, mirrored from GitHub: the internal documentation (docs, pages-internal)
#   - release tags, mirrored from GitHub: the internal package registry (packaging,
#     deploy-tag-internal). PyPI, the installers and the images are published from GitHub.
#
# Nothing is cached between jobs: the caches of the virtual environments filled up the disks
# of the runners. Jobs that need pyRadPlan install it with uv (see .venv), the others only
# install their tool.
workflow:
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^(internal|devops)\//'
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

default:
    image: python:3.13-slim-bookworm
    interruptible: true
    timeout: 60 minutes

variables:
    # The environment is outside of the project directory, which outlives the job on the runner.
    UV_PYTHON_PREFERENCE: only-system
    UV_LINK_MODE: copy
    # Jobs run side by side on the same machine and would each start a thread per core.
    OMP_NUM_THREADS: "4"
    OPENBLAS_NUM_THREADS: "4"

stages:
    - test
    - package
    - deploy

.venv:
    before_script:
        - pip install uv
        - uv venv /opt/venv
        - . /opt/venv/bin/activate

.work-branches:
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^(internal|devops)\//'

# The expensive jobs, once an internal branch is about to be merged. A merge request shows the
# pipeline of its source branch, so the merge request needs to be open at the time of the push.
.before-merge:
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^devops\//'
        - if: '$CI_COMMIT_BRANCH =~ /^internal\// && $CI_OPEN_MERGE_REQUESTS'

# The jobs building what GitHub builds as well: an internal branch only needs them on request.
.on-request:
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^devops\//'
        - if: '$CI_COMMIT_BRANCH =~ /^internal\//'
          when: manual
          allow_failure: true

lint:
    extends: .work-branches
    stage: test
    script:
        - pip install ruff==0.15.22
        - return_code=0
        - ruff check --output-format grouped || return_code=$(($return_code + $?))
        - ruff check --exit-zero --output-format grouped --output-file ruff.txt
        - ruff check --exit-zero --output-format gitlab --output-file gl-code-quality-report.json
        - exit $return_code
    artifacts:
        reports:
            codequality: gl-code-quality-report.json
        paths:
            - ruff.txt
        when: always
        expire_in: 1 week

    allow_failure: true

format:
    extends: .work-branches
    stage: test
    script:
        - pip install ruff==0.15.22
        - ruff format --check

codespell:
    extends: .work-branches
    stage: test
    script:
        - pip install codespell
        - return_code=0
        - codespell > codespell.txt || return_code=$?
        - cat codespell.txt
        - python .gitlab/scripts/codespell_to_codequality.py < codespell.txt > gl-codespell-quality.json
        - exit $return_code
    artifacts:
        when: always
        reports:
            codequality: gl-codespell-quality.json
        paths:
            - codespell.txt
            - gl-codespell-quality.json
        expire_in: 1 week
    allow_failure: true

.test:
    extends: .venv
    stage: test
    image: python:${PYTHON_VERSION}-slim-bookworm
    variables:
        QT_QPA_PLATFORM: "offscreen"
    script:
        - apt-get update && apt-get install -y libgl1 libxkbcommon-x11-0 libegl1 libdbus-1-3 libglib2.0-0 libfontconfig1 libnss3 libasound2 # needed for pyqt tests
        - uv pip install -e ".[gui]" pytest pytest-cov pytest-timeout
        # CPU-only torch, so the ai.modelhub loader tests actually run. Tolerated
        # to fail: torch lags new Python releases, and the tests that need it
        # skip themselves when it is absent.
        - uv pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch unavailable for ${PYTHON_VERSION}, ai.modelhub load tests will skip"
        - mkdir -p .testreports
        - COVER_XML=.testreports/coverage-${PYTHON_VERSION}.xml
        - HTML_DIR=.testreports/html-${PYTHON_VERSION}
        - mkdir -p $HTML_DIR
        - pytest test --timeout=300 --junitxml=.testreports/report-${PYTHON_VERSION}.xml --cov=pyRadPlan --cov-report term --cov-report xml:$COVER_XML --cov-report html:$HTML_DIR
    artifacts:
        when: always
        reports:
          junit: .testreports/report-${PYTHON_VERSION}.xml
          coverage_report:
            coverage_format: cobertura
            path: .testreports/coverage-${PYTHON_VERSION}.xml
        paths:
            - .testreports/html-${PYTHON_VERSION}
            - .testreports/coverage-${PYTHON_VERSION}.xml
            - .testreports/report-${PYTHON_VERSION}.xml
        expire_in: 1 week
    coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

# The reference Python version, for every push.
tests:
    extends:
        - .test
        - .work-branches
    variables:
        PYTHON_VERSION: "3.13"

# The oldest and newest supported Python version.
tests-matrix:
    extends:
        - .test
        - .before-merge
    parallel:
        matrix:
            - PYTHON_VERSION: ["3.10", "3.14"]

# Exercise the optional array-API backends on their CPU builds, once per backend as
# the *default* namespace (PYRADPLAN_XP_*), so engines and tracers run on it too.
# CuPy needs a GPU runner and is therefore not covered here.
tests-backends:
    extends:
        - .venv
        - .before-merge
    stage: test
    parallel:
        matrix:
            - XP_BACKEND: ["torch", "jax"]
    variables:
        PYRADPLAN_XP_PREFER_GPU: "false"
        PYRADPLAN_XP_PREFERRED_CPU_ARRAY_BACKEND: "${XP_BACKEND}"
    script:
        - uv pip install -e ".[jax]" pytest pytest-timeout
        - uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        - pytest test/core/xp_utils test/dose test/test_raytracersiddon.py test/stf -q --timeout=300

packaging:
    stage: package
    dependencies: []
    variables:
        TWINE_USERNAME: gitlab-ci-token
        TWINE_PASSWORD: $CI_JOB_TOKEN
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^(internal|devops)\//'
        - if: '$CI_COMMIT_TAG'
    script:
        - pip install --upgrade build
        - python -m build
    artifacts:
        paths:
            - dist/
        expire_in: 1 week

# Desktop installer (Briefcase, packaging/briefcase) of the GUI. Only the Linux .deb can be
# built here, on the Docker runners: the Windows MSI and the macOS DMG are built by the
# "Desktop installers" GitHub workflow. Briefcase builds a Linux system package under the
# target distribution's own python3, hence the Debian image for Python 3.13 instead of the
# python one. The release .deb comes from GitHub and is built on Ubuntu 24.04.
installer-linux:
    extends: .on-request
    stage: package
    image: debian:trixie
    dependencies: []
    variables:
        DEBIAN_FRONTEND: noninteractive
        PYTHONUTF8: "1"
        QT_QPA_PLATFORM: "offscreen"
    script:
        # git: Briefcase fetches its app template with it; gnupg: its package command looks for
        # gpg. The Qt libraries are the system_runtime_requires of the Briefcase project plus
        # those of the smoke test.
        - apt-get update
        - >
            apt-get install -y --no-install-recommends
            ca-certificates git gnupg python3 python3-dev python3-pip python3-venv build-essential dpkg-dev
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1
            libglib2.0-0 libnss3 libasound2t64
        # A venv of /usr/bin/python3 reports the same sys.version, which is what Briefcase
        # checks for the system packaging format.
        - python3 -m venv /opt/briefcase-venv
        - /opt/briefcase-venv/bin/python -m pip install --upgrade pip
        - /opt/briefcase-venv/bin/python -m pip install "briefcase==0.4.7"
        - export PATH=/opt/briefcase-venv/bin:$PATH
        - python packaging/briefcase/scripts/sync_version.py
        - cd packaging/briefcase
        - python scripts/run_briefcase.py create linux system --no-input
        - python scripts/run_briefcase.py build linux system --no-input
        - python scripts/run_briefcase.py run linux system --test --no-input
        # `run --test` copied the test sources into the bundle; refresh the app code
        # (not the requirements) so the installer ships without them.
        - python scripts/run_briefcase.py build linux system --update --no-input
        - python scripts/collect_licenses.py --check
        - python scripts/run_briefcase.py package linux system --no-input
        - ls -l dist
    # The runners limit the size of artifacts and the .deb is almost 300 MB, so the package is
    # not kept: the job only shows that the installer builds (the GitHub workflow keeps it).
    # The small Briefcase logs of a failed job are.
    artifacts:
        when: on_failure
        paths:
            - packaging/briefcase/logs/
        expire_in: 1 week

# The pyRadPlan GUI in a web browser (packaging/container, see its README), built with
# Docker-in-Docker like the "Container" GitHub workflow, and tested with the same script. The
# images are published from GitHub. Needs a privileged runner for the docker:dind service;
# without TLS, as the runner need not share the certificate volume.
container:
    extends: .on-request
    stage: package
    image: docker:27
    dependencies: []
    services:
        - docker:27-dind
    variables:
        DOCKER_HOST: tcp://docker:2375
        DOCKER_TLS_CERTDIR: ""
    script:
        - >
            docker build -f packaging/container/Dockerfile
            --build-arg VERSION="$CI_COMMIT_SHORT_SHA"
            --build-arg REVISION="$CI_COMMIT_SHA" --build-arg SOURCE="$CI_PROJECT_URL"
            -t pyradplan-web .
        - docker run -d --name web -e XPRA_PASSWORD=ci-test pyradplan-web
        - sh packaging/container/smoke_test.sh web
    after_script:
        - docker logs web || true

docs:
    extends: .venv
    stage: package
    dependencies: []
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^(internal|devops)\//'
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    script:
        - uv pip install -e ".[gui]" -r docs/requirements.txt
        # Examples are never executed in CI: release commits carry the executed notebooks
        - sphinx-build docs .doc
    artifacts:
        when: always
        paths:
            - .doc
        expire_in: 1 week

deploy-tag-internal:
    stage: deploy
    interruptible: false
    variables:
        TWINE_USERNAME: gitlab-ci-token
        TWINE_PASSWORD: $CI_JOB_TOKEN
    rules:
        - if: '$CI_COMMIT_TAG'
    script:
        - pip install --upgrade twine
        - python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
    dependencies:
        - packaging

pages-internal:
    stage: deploy
    dependencies:
        - docs
    script:
        - mv .doc public/

    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
