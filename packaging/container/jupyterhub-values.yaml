# Zero to JupyterHub (Helm chart 4.4.x, JupyterHub 5.5) serving pyRadPlan sessions of the
# pyradplan-hub image (Dockerfile.hub), installed into a single namespace without cluster-wide
# permissions. Every user gets a pod of their own with the GUI in the browser; see README.md.
#
#   helm repo add jupyterhub https://hub.jupyter.org/helm-chart/
#   helm upgrade --install pyradplan-hub jupyterhub/jupyterhub --version 4.4.4 \
#       --namespace <namespace> --values jupyterhub-values.yaml
#
# Replace the values marked CHANGE-ME first.

hub:
  config:
    JupyterHub:
      # Sessions at the same time; more users get "Active user limit exceeded" and can retry.
      # Size it to the namespace quota: each session may use 2 CPUs and 16 GiB (singleuser
      # below), the hub and its proxy 1 CPU and 1.5 GiB together.
      active_server_limit: 1
    # The users and their password hashes, from make_hub_users.py (see PasswordListAuthenticator
    # in extraConfig below). Only these users can log in.
    PasswordListAuthenticator:
      password_hashes:
        admin: CHANGE-ME
    Authenticator:
      # Admins can watch and stop all sessions on the hub's Admin page.
      admin_users: [admin]
      # Whoever passes PasswordListAuthenticator may use the hub.
      allow_all: true
  extraConfig:
    passwordList: |
      import asyncio
      import hashlib
      import hmac

      from jupyterhub.auth import Authenticator
      from traitlets import Dict, Unicode


      class PasswordListAuthenticator(Authenticator):
          """Users with passwords set up in advance, stored as PBKDF2-SHA256 hashes."""

          password_hashes = Dict(
              key_trait=Unicode(),
              value_trait=Unicode(),
              config=True,
              help="User name -> 'pbkdf2_sha256$<iterations>$<salt hex>$<hash hex>'.",
          )

          async def authenticate(self, handler, data):
              name = self.normalize_username(data["username"])
              try:
                  scheme, iterations, salt, expected = self.password_hashes[name].split("$")
                  if scheme != "pbkdf2_sha256":
                      raise ValueError(scheme)
                  digest = await asyncio.to_thread(
                      hashlib.pbkdf2_hmac,
                      "sha256",
                      data["password"].encode(),
                      bytes.fromhex(salt),
                      int(iterations),
                  )
              except KeyError:
                  return None
              except ValueError:
                  self.log.error("Password hash of user %s is not from make_hub_users.py", name)
                  return None
              return name if hmac.compare_digest(digest.hex(), expected) else None


      c.JupyterHub.authenticator_class = PasswordListAuthenticator
  # The hub keeps its state in a SQLite file on a 1 GiB volume of the default storage class.
  # Without a storage class use "type: sqlite-memory": a restarted hub then forgets the
  # running sessions.
  db:
    type: sqlite-pvc
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}

proxy:
  # Reached through the ingress below, not a load balancer of its own.
  service:
    type: ClusterIP
  chp:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - CHANGE-ME.example.org

singleuser:
  image:
    name: ghcr.io/e0404/pyradplan-hub
    tag: "CHANGE-ME"
  # The session server of the image in place of jupyterhub-singleuser. The session ends when
  # the GUI is closed; the hub then offers to start a new one.
  cmd: hub-session.sh
  uid: 10001
  fsGid: 10001
  # Each session starts with a fresh home directory.
  storage:
    type: none
  cpu:
    guarantee: 1
    limit: 2
  memory:
    guarantee: 8G
    limit: 16G
  # The default blocks the cloud metadata server with a privileged init container; the
  # network policy of the sessions blocks it as well.
  cloudMetadata:
    blockWithIptables: false

# Stops sessions whose browser tab has been closed for 30 minutes.
cull:
  enabled: true
  timeout: 1800
  every: 300

# Parts that need cluster-wide permissions (the user scheduler's ClusterRole) or run on every
# node (the image pullers).
scheduling:
  userScheduler:
    enabled: false
  userPlaceholder:
    enabled: false
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
