[build-system]
requires = ["setuptools>=64","setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["matRad","build"]

[tool.setuptools.package-data]
pyRadPlan = ["data/**/*", "gui/assets/**/*"]

[project]
name = "pyRadPlan"
version = "0.4.1"
# dynamic = ["version"] # Will be used in the future
authors = [
  { name="Niklas Wahl", email = "n.wahl@dkfz-heidelberg.de"},
  { name="Tobias Becher", email = "t.becher@dkfz-heidelberg.de" },
  { name="Lina Bucher", email = "lina.bucher@dkfz-heidelberg.de" },
  { name="Louis Ermeneux", email = "louis.ermeneux@gmail.com" },
  { name="Antonios Kontopoulos", email = "antonios.kontopoulos@dkfz-heidelberg.de" },
  { name="Julius Laub", email = "julius.laub@dkfz-heidelberg.de" },
  { name="Florian Leininger", email = "florian.leininger@dkfz-heidelberg.de" },
  { name="Tim Ortkamp", email = "tim.ortkamp@kit.edu" },
  { name="Victoria Santiago Aguilar", email = "victoria.santiagoaguilar@dkfz-heidelberg.de" },
  { name="Goran Stanic", email = "goran.stanic@dkfz-heidelberg.de" },
  { name="Samir Schulz", email = "samirshivaji.schulz@dkfz-heidelberg.de" },
  { name="Wilfrid Wangon Zekou", email = "wangonwil@gmail.com" },
  { name="Jennifer Josephine Hardt", email = "jennifer.hardt@dkfz-heidelberg.de" }
]

maintainers = [
  { name="Niklas Wahl", email = "n.wahl@dkfz-heidelberg.de"},
  { name="Florian Leininger", email = "florian.leininger@dkfz-heidelberg.de" },
  { name="Tobias Becher", email = "t.becher@dkfz-heidelberg.de" },
  { name="Tim Ortkamp", email = "tim.ortkamp@kit.edu" }
]

description = "A python interface and reimplementation to matRad"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "scipy>=1.13.0",
    "numpy>=2.0,<=2.3",
    "array_api_compat",
    "array_api_strict",
    "array_api_extra",
    "types-array-api",
    "pymatreader>=1.0.0",
    "h5py>=3.11.0",
    "regex>=2024.5.15",
    "pydicom>=2.4.4",
    "matplotlib>=3.9.2",
    "pydantic>=2.10,<2.20",
    "pydantic-settings>=2.0,<3.0",
    "pydantic_ai>=1.60,<2.0",
    "numpydantic>=1.6.9",
    "SimpleITK>=2.4.0",
    "tqdm>=4.0.0",
    "pint>=0.24.0",
    "jinja2",
#   "cudatoolkit",
#   "Raytrace@git+https://github.com/ryanneph/raytrace.git@master#egg=raytrace"
]

[project.optional-dependencies]
matlab = ["matlabengine"]
octave = ["oct2py"]
gui    = ["pyside6>=6.0.1", "pyqtgraph>=0.12.0"]
numba  = ["numba>=0.61.0"]

dev = ["pytest","coverage","pytest-cov","pytest-benchmark","pre-commit","liccheck","sphinx","numpydoc","pydata-sphinx-theme","sphinx-design","autodoc_pydantic","sphinx-autodoc-typehints"]

[project.scripts]
pyRadPlanGUI = "pyRadPlan.gui:main"

[project.urls]
"Homepage" = "https://git.dkfz.de"

[tool.ruff]
line-length = 99
indent-width = 4
extend-exclude = [
  ".venv",
  ".git",
  "__pycache__",
  "docs",
  "matRad",
]
extend-include = [
  "examples",
]

[tool.ruff.lint]
extend-select = ["PL","D", "NPY", "N"]
extend-ignore = ["E203", "E701", "F722", "RET504", "C901", "D202", "PLR2004", "N813", "N999"]
exclude = ["test/**/*.py", "benchmark/**/*.py"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"


# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Configuration in case someone uses pylint, flake or Black
[tool.pylint.message_control]
disable = ["import-error"]
ignore-paths = [
  "test/*",
]

[tool.pylint.BASIC]
good-names-rgxs = "[_a-z][_a-z0-9]?$"

[tool.black]
# For code, we use the relaxed 99 line limit
line-length = 99
extend-exclude = '''
(
  ^/.venv
  ^/.git"
  ^/__pycache__
  ^/docs
  ^/matRad
  ^/test
)
'''

[tool.flake8]
max-line-length = 99
exclude = [
  ".venv",
  ".git",
  "__pycache__",
  "docs",
  "matRad",
  "test" ]
extend-ignore = ["E203","E701","F722"]

[tool.liccheck]
level = "STANDARD"
dependencies = true
authorized_licenses = [
  "bsd",
  "new bsd",
  "bsd license",
  "new bsd license",
  "simplified bsd",
  "3-clause bsd",
  "bsd-3-clause",
  "bsd-2-clause",
  "apache",
  "apache 2.0",
  "apache-2.0",
  "apache software",
  "apache software license",
  "mit",
  "mit license",
  "mit and apache-2.0",
  "mit-cmu",
  "cmu license (mit-cmu)",
  "isc",
  "isc license",
  "isc license (iscl)",
  "python software foundation",
  "python software foundation license",
  "psf-2.0",
  "mozilla public license 2.0 (mpl 2.0)",
  "mpl-2.0",
  "the unlicense (unlicense)",
  "unlicense",
  "historical permission notice and disclaimer (hpnd)",
  "zlib",
]

[tool.codespell]
skip = "./matRad,*/matRad/*"
ignore-words-list = "coo"

[tool.pydocstringformatter]
write = true
exclude = [
  "**/.venv/**",
  "**/.git",
  "**/__pycache__/**",#
  "**/docs/**",
  "matRad/**"
  ]
style = ["numpydoc"]
linewrap-full-docstring = true

[tool.pylint.format]
max-line-length = 99
ignore = [
  ".venv",
  ".git",
  "__pycache__",
  "docs",
  "matRad",
  "test" ]
