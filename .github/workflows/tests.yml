name: Python package

on:
  push:
    branches:
      - main
      - develop
      - 'rc/**'
      - 'devops/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
        - uses: actions/checkout@v7

        - name: Setup Python ${{ matrix.python-version }}
          uses: actions/setup-python@v7
          with:
            python-version: ${{ matrix.python-version }}
            cache: pip

        - name: Install system Qt dependencies
          if: runner.os == 'Linux'
          run: |
            sudo apt-get update
            sudo apt-get install -y libgl1 libxkbcommon-x11-0 libegl1 libdbus-1-3 libglib2.0-0 libfontconfig1 libnss3 libasound2t64

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install pytest pytest-cov pytest-timeout ruff
            python -m pip install -e ".[gui]"

        - name: Run tests with pytest
          env:
            QT_QPA_PLATFORM: offscreen
          run: pytest test --timeout=300 --junitxml=.testreports/report.xml -o junit_family=legacy --cov=pyRadPlan --cov-report term --cov-report xml:.testreports/coverage.xml --cov-report html:.testreports/html

        - name: Upload test reports to Codecov
          if: runner.os == 'Linux'
          uses: codecov/test-results-action@v1
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            flags: 'py${{ matrix.python-version }}'
            files: .testreports/report.xml

        - name: Upload coverage reports to Codecov
          if: matrix.python-version == '3.11'
          uses: codecov/codecov-action@v7
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: .testreports/coverage.xml # optional

  # Exercise the optional array-API backends on their CPU builds, once per backend as the
  # *default* namespace (PYRADPLAN_XP_*), so engines and tracers run on it too. CuPy needs a
  # GPU runner and is therefore not covered here.
  test-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, jax]
    env:
      PYRADPLAN_XP_PREFER_GPU: "false"
      PYRADPLAN_XP_PREFERRED_CPU_ARRAY_BACKEND: ${{ matrix.backend }}
    steps:
        - uses: actions/checkout@v7
        - name: Setup Python 3.13
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
            cache: pip
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[jax]" pytest pytest-timeout
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        - name: Run tests with pytest
          run: pytest test/core/xp_utils test/dose test/test_raytracersiddon.py test/stf -q --timeout=300

  # The lint results also go to GitHub code scanning, which compares them with the target branch
  # and reports the new ones on the pull request, like the code quality report of GitLab. The
  # token of a pull request from a fork cannot upload: those only get the annotations, which show
  # on the changed lines as well. A step can only show 10 of them, so that on a pull request they
  # are limited to the changed files (HEAD is the merge commit, its first parent the target
  # branch), and findings elsewhere do not use them up.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 2
        - name: Setup Python 3.13
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install ruff==0.15.22
        - name: Lint with ruff
          run: |
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              git diff --name-only -z --diff-filter=d HEAD^1 HEAD -- '*.py' | xargs -0 -r ruff check --force-exclude --output-format=github
            else
              ruff check --output-format=github
            fi
          continue-on-error: true
        - name: Write the code scanning report
          run: |
            ruff check --exit-zero --output-format=sarif --output-file=ruff.sarif
            sed -i "s#file://$GITHUB_WORKSPACE/##g" ruff.sarif
        - name: Upload the code scanning report
          if: ${{ !github.event.pull_request.head.repo.fork }}
          uses: github/codeql-action/upload-sarif@v4
          continue-on-error: true
          with:
            sarif_file: ruff.sarif
            category: ruff
        - name: Check formatting with ruff
          run: ruff format --check

  # The other hooks of the contributors' pre-commit setup: ruff has its own job above, with the
  # version the code is checked against. Changelog format, citation file, licenses, spelling.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
        - uses: actions/checkout@v7
        - name: Setup Python 3.13
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
        - name: Install pre-commit
          run: python -m pip install pre-commit
        - name: Run the hooks
          env:
            SKIP: ruff,ruff-format
          run: pre-commit run --all-files --show-diff-on-failure
