name: Python package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
        - uses: actions/checkout@v4

        - name: Setup Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            cache: pip

        - name: Install system Qt dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y libgl1 libxkbcommon-x11-0 libegl1 libdbus-1-3 libglib2.0-0 libfontconfig1 libnss3 libasound2t64

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install pytest pytest-cov ruff
            python -m pip install -e ".[gui]"

        - name: Run tests with pytest
          env:
            QT_QPA_PLATFORM: offscreen
          run: pytest test --junitxml=.testreports/report.xml -o junit_family=legacy --cov=pyRadPlan --cov-report term --cov-report xml:.testreports/coverage.xml --cov-report html:.testreports/html

        - name: Upload test reports to Codecov
          uses: codecov/test-results-action@v1
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            flags: 'py${{ matrix.python-version }}'
            files: .testreports/report.xml

        - name: Upload coverage reports to Codecov
          if: matrix.python-version == '3.11'
          uses: codecov/codecov-action@v5
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: .testreports/coverage.xml # optional

  lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - name: Setup Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: 3.12
            cache: pip
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install ruff==0.15.22
            python -m pip install -e .
        - name: Lint with ruff
          run: ruff check --output-format=github
          continue-on-error: true
        - name: Check formatting with ruff
          run: ruff format --check
