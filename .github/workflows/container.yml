name: Container

# Builds the image of packaging/container (the pyRadPlan GUI in a web browser, see its
# README) and checks that it works with packaging/container/smoke_test.sh, which the GitLab
# pipeline runs as well. For a v* tag the tested image is published to the GitHub Container
# Registry as ghcr.io/<owner>/pyradplan-web:<version>, and as :latest unless the version is
# a pre-release.

on:
  push:
    branches:
      - main
      - 'rc/**'
      - 'devops/**'
    tags:
      - 'v*'
    paths: &paths
      - 'pyRadPlan/**'
      - 'pyproject.toml'
      - 'packaging/container/**'
      - 'packaging/briefcase/scripts/collect_licenses.py'
      - '.github/workflows/container.yml'
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: container-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # for publishing; the token of a pull request from a fork is read-only anyway

    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker build -f packaging/container/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -t pyradplan-web .

      - name: Start a session
        run: docker run -d --name web -e XPRA_PASSWORD=ci-test pyradplan-web

      - name: Smoke test
        run: sh packaging/container/smoke_test.sh web

      - name: Container log
        if: always()
        run: docker logs web || true

      - name: Publish to the GitHub Container Registry
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pyradplan-web"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag pyradplan-web "$image:$version"
          docker push "$image:$version"
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            docker tag pyradplan-web "$image:latest"
            docker push "$image:latest"
          fi
