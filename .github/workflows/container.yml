name: Container

# Builds the images of packaging/container (the pyRadPlan GUI in a web browser, and on top of
# it the JupyterHub session image, see its README) and checks both with
# packaging/container/smoke_test.sh, which the GitLab pipeline runs as well. For a v* tag the
# tested images are published to the GitHub Container Registry as
# ghcr.io/<owner>/pyradplan-web:<version> and ghcr.io/<owner>/pyradplan-hub:<version>, and
# as :latest unless the version is a pre-release.

on:
  push:
    branches:
      - main
      - 'rc/**'
      - 'devops/**'
    tags:
      - 'v*'
    paths: &paths
      - 'pyRadPlan/**'
      - 'pyproject.toml'
      - 'packaging/container/**'
      - 'packaging/briefcase/scripts/collect_licenses.py'
      - '.github/workflows/container.yml'
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: container-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # for publishing; the token of a pull request from a fork is read-only anyway

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker build -f packaging/container/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -t pyradplan-web .

      - name: Phantoms of matRad in the image
        run: |
          docker run --rm --entrypoint python3 pyradplan-web -c \
            "from pyRadPlan.io import available_phantoms; names = available_phantoms(); print(names); assert {'BOXPHANTOM', 'HEAD_AND_NECK', 'LIVER', 'PROSTATE'} <= set(names)"

      - name: Start a session
        run: docker run -d --name web -e XPRA_PASSWORD=ci-test pyradplan-web

      - name: Smoke test
        run: sh packaging/container/smoke_test.sh web

      - name: Container log
        if: always()
        run: docker logs web || true

      - name: Build the JupyterHub image
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker build -f packaging/container/Dockerfile.hub \
            --build-arg BASE_IMAGE=pyradplan-web \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -t pyradplan-hub packaging/container

      - name: Start a JupyterHub session without a hub
        run: docker run -d --name hub pyradplan-hub hub-session.sh --no-authentication --port=8888

      - name: Smoke test of the JupyterHub image
        env:
          SMOKE_URL: http://localhost:8888/
        run: sh packaging/container/smoke_test.sh hub

      - name: JupyterHub session log
        if: always()
        run: docker logs hub || true

      - name: Publish to the GitHub Container Registry
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in pyradplan-web pyradplan-hub; do
            docker tag "$name" "$registry/$name:$version"
            docker push "$registry/$name:$version"
            if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              docker tag "$name" "$registry/$name:latest"
              docker push "$registry/$name:latest"
            fi
          done
